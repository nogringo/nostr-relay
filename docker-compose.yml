services:
  relay:
    image: ghcr.io/nogringo/nostr-relay:latest
    container_name: nostr-relay
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "3334:3334"
    volumes:
      - relay-db:/data
    # Put a TLS reverse proxy in front that forwards the original Host header,
    # which the relay uses to build the NIP-42 AUTH challenge URL.

volumes:
  relay-db:
